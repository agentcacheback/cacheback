[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcc"
version = "0.1.0"
description = "Receiver-conditioned latent communication between agents: score the worker's KV cache against the receiver's query, send just enough state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "torch>=2.2",
  "transformers>=5.13,<5.14",
  "accelerate>=1.14,<1.15",
  "huggingface_hub>=0.35",
  "mistral-common>=1.5",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The benchmark runners serve through vLLM; the two measured stacks are pinned
# under requirements/, one file per stack.
dev = ["ruff==0.15.20", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rcc"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "D", "N", "RUF", "SIM"]
ignore = ["D203", "D213", "SIM105", "SIM102", "SIM108", "SIM103", "SIM118"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"experiments/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
include = ["src/rcc"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: needs a GPU and model weights; not run by default",
  "integration: multi-process or lifecycle simulations, run explicitly",
  "live: drives a real engine seam; kept in the default run",
]
addopts = "-q --strict-markers -m 'not gpu and not integration'"
